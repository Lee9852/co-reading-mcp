<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共读 · S</title>
    <link rel="stylesheet" href="/reader.css" />
  </head>
  <body class="view-shelf">
    <main class="app">
      <section class="sidebar" id="shelf-view" aria-label="书架">
        <header class="topbar">
          <div class="brand">
            <p class="eyebrow">CO-READING · S</p>
            <h1>共读</h1>
            <p class="brand-line">和喜欢的故事，一起慢慢读。</p>
          </div>
          <div class="topbar-actions">
            <button id="import-book" class="icon-button" title="导入 EPUB / TXT / Markdown">＋</button>
            <button id="refresh" class="icon-button" title="刷新书架">↻</button>
          </div>
          <input id="import-file" type="file" accept=".epub,.txt,.text,.md,.markdown" multiple hidden />
        </header>

        <section id="resume-card" class="resume-card" hidden>
          <div class="resume-copy">
            <p class="resume-kicker">继续阅读</p>
            <h2 id="resume-title">还没有阅读记录</h2>
            <p id="resume-meta" class="resume-meta"></p>
            <span class="resume-progress"><span id="resume-progress"></span></span>
          </div>
          <button id="resume-open" class="resume-open" type="button">继续 ›</button>
        </section>

        <div class="shelf-heading">
          <div>
            <p class="eyebrow">LIBRARY</p>
            <h2>我的书架</h2>
          </div>
          <label class="import-option" title="导入 EPUB 时保留书内图片">
            <input id="import-keep-images" type="checkbox" checked />
            保留图片
          </label>
        </div>
        <div id="books" class="books" aria-live="polite"></div>
      </section>

      <section class="chapters" id="chapters-view" aria-label="目录">
        <header class="panel-head">
          <button id="chapters-back" class="back-button" type="button" aria-label="返回书架">‹</button>
          <div class="panel-copy">
            <p id="book-meta" class="eyebrow">选择一本书</p>
            <h2 id="book-title">目录</h2>
          </div>
        </header>
        <div id="chunks" class="chunk-list"></div>
      </section>

      <section class="reader" id="reader-view" aria-label="阅读器">
        <header class="reader-head">
          <button id="reader-back" class="back-button" type="button" aria-label="返回书架">‹</button>
          <div class="reader-title-block">
            <p id="chunk-file" class="eyebrow">还没选章节</p>
            <h2 id="chunk-title">打开章节开始阅读</h2>
          </div>
          <div class="reader-actions">
            <button id="show-card" class="secondary-button" disabled>卡片</button>
            <button id="continue-reading" class="secondary-button" disabled>继续</button>
            <button id="mark-read" class="secondary-button accent-action" disabled>读完这段</button>
          </div>
        </header>

        <article id="text" class="text">
          <p class="empty">先选一本书和章节。长按选中文字，就能给 S 留批注。</p>
        </article>

        <div class="chapter-end">
          <button id="next-chapter" class="next-chapter" type="button" disabled>下一章 →</button>
        </div>

        <aside id="margins" class="margins" aria-label="页边批注"></aside>

        <form id="note-form" class="note-form" hidden>
          <div class="quote-preview" id="quote-preview"></div>
          <textarea id="note" rows="3" placeholder="写下你想对 S 说的话..."></textarea>
          <div class="form-actions">
            <button type="button" id="cancel-note" class="secondary-button">取消</button>
            <button type="submit" class="primary-button">保存批注</button>
          </div>
        </form>

        <footer class="submitbar">
          <button id="note-selection" class="note-selection-button" disabled>✎ 批注</button>
          <span id="status">批注会先私下保存，发送后 S 才能看到。</span>
          <button id="submit-notes" class="s-button" disabled aria-label="发送批注给 S">S</button>
        </footer>

        <div id="toast" class="toast" hidden></div>

        <aside id="card-panel" class="card-panel" hidden aria-label="共读卡片">
          <div class="card-panel-head">
            <div>
              <p class="eyebrow">共读卡片</p>
              <h2>我们的折痕</h2>
            </div>
            <button id="card-close" class="icon-button" title="关闭">×</button>
          </div>
          <div id="card-preview" class="card-preview"></div>
          <div class="card-actions">
            <button id="card-random" class="secondary-button">换一张</button>
          </div>
        </aside>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="阅读导航">
      <button id="nav-shelf" class="nav-item active" type="button"><span>▥</span>书架</button>
      <button id="nav-chapters" class="nav-item" type="button"><span>☰</span>目录</button>
      <button id="nav-notes" class="nav-item" type="button"><span>✎</span>批注</button>
    </nav>

    <script type="module" src="/reader.js"></script>
  </body>
</html>
