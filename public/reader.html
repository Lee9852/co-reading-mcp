<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共读 · S</title>
    <link rel="stylesheet" href="/reader.css" />
  </head>
  <body>
    <main class="app">
      <section class="sidebar" aria-label="Library">
        <header class="topbar">
          <div>
            <p class="eyebrow">CO-READING · S</p>
            <h1>书架</h1>
          </div>
          <div class="topbar-actions">
            <button id="import-book" class="icon-button" title="导入 EPUB / TXT / Markdown">＋</button>
            <button id="refresh" class="icon-button" title="刷新书架">↻</button>
          </div>
          <input id="import-file" type="file" accept=".epub,.txt,.text,.md,.markdown" multiple hidden />
        </header>
        <label class="import-option" title="Copy pictures and formula images from EPUBs you import">
          <input id="import-keep-images" type="checkbox" checked />
          导入 EPUB 时保留图片
        </label>
        <div id="books" class="books" aria-live="polite"></div>
      </section>

      <section class="chapters" aria-label="Chapters">
        <header class="panel-head">
          <p id="book-meta" class="eyebrow">选择一本书</p>
          <h2 id="book-title">共读书架</h2>
        </header>
        <div id="chunks" class="chunk-list"></div>
      </section>

      <section class="reader" aria-label="Reader">
        <header class="reader-head">
          <div>
            <p id="chunk-file" class="eyebrow">还没选章节</p>
            <h2 id="chunk-title">打开章节开始阅读</h2>
          </div>
          <div class="reader-actions">
            <button id="show-card" class="secondary-button" disabled>卡片</button>
            <button id="continue-reading" class="secondary-button" disabled>继续</button>
            <button id="mark-read" class="secondary-button" disabled>读完这段</button>
          </div>
        </header>

        <article id="text" class="text">
          <p class="empty">先选一本书和章节。长按选中文字，就能给 S 留批注。</p>
        </article>

        <aside id="margins" class="margins" aria-label="页边批注"></aside>

        <form id="note-form" class="note-form" hidden>
          <div class="quote-preview" id="quote-preview"></div>
          <textarea id="note" rows="3" placeholder="写下你想对 S 说的话..."></textarea>
          <div class="form-actions">
            <button type="button" id="cancel-note" class="secondary-button">取消</button>
            <button type="submit" class="primary-button">保存批注</button>
          </div>
        </form>

        <footer class="submitbar">
          <span id="status">批注会先私下保存，发送后 S 才能看到。</span>
          <div class="submit-actions">
            <button id="note-selection" class="secondary-button" disabled>批注选中内容</button>
            <button id="submit-notes" class="primary-button" disabled>Send to S</button>
          </div>
        </footer>

        <div id="toast" class="toast" hidden></div>

        <aside id="card-panel" class="card-panel" hidden aria-label="Reading card">
          <div class="card-panel-head">
            <div>
              <p class="eyebrow">共读卡片</p>
              <h2>我们的折痕</h2>
            </div>
            <button id="card-close" class="icon-button" title="关闭">×</button>
          </div>
          <div id="card-preview" class="card-preview"></div>
          <div class="card-actions">
            <button id="card-random" class="secondary-button">换一张</button>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/reader.js"></script>
  </body>
</html>
